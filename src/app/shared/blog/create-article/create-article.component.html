<h2 *ngIf="!isEditMode">Creare Articol Nou</h2>
<h2 *ngIf="isEditMode">Editare Articol</h2>

<div class="container">
  <form (ngSubmit)="onSubmit()" #articleForm="ngForm">
    <!-- Titlu -->
    <div class="form-group">
      <label for="title">Titlu:</label>
      <input type="text" id="title" [required]="!isEditMode"
             [(ngModel)]="article.title" name="title" #title="ngModel">
      <div *ngIf="!isEditMode && title.invalid && (title.dirty || title.touched)" class="error">
        Titlu este necesar.
      </div>
    </div>

    <!-- Slug -->
    <div class="form-group">
      <label for="slug">Slug (URL-friendly):</label>
      <input type="text" id="slug" [required]="!isEditMode"
             [(ngModel)]="article.slug" name="slug" #slug="ngModel">
      <div *ngIf="!isEditMode && slug.invalid && (slug.dirty || slug.touched)" class="error">
        Slug-ul este necesar.
      </div>
      <small>Exemplu: "trimestrul-1-ghid"</small>
    </div>

    <!-- Descriere -->
    <div class="form-group">
      <label for="description">Descriere:</label>
      <textarea id="description" [required]="!isEditMode"
                [(ngModel)]="article.description" name="description" #description="ngModel"></textarea>
      <div *ngIf="!isEditMode && description.invalid && (description.dirty || description.touched)" class="error">
        Descrierea este necesară.
      </div>
    </div>

    <!-- Rezumat -->
    <div class="form-group">
      <label for="summary">Rezumat (SEO):</label>
      <textarea id="summary" [(ngModel)]="article.summary" name="summary"></textarea>
      <small>Folosit ca fallback pentru meta description.</small>
    </div>

    <!-- Path către poza -->
    <div class="form-group">
      <label for="imagePath">Path către poza:</label>
      <input type="text" id="imagePath" [required]="!isEditMode"
             [(ngModel)]="article.imagePath" name="imagePath" #imagePath="ngModel">
      <div *ngIf="!isEditMode && imagePath.invalid && (imagePath.dirty || imagePath.touched)" class="error">
        Path-ul către poza este necesar.
      </div>
    </div>

    <!-- Conținut -->
    <div class="form-group">
      <label for="content">Conținut:</label>
      <textarea id="content" [required]="!isEditMode"
                [(ngModel)]="article.content" name="content" #content="ngModel"></textarea>
      <div *ngIf="!isEditMode && content.invalid && (content.dirty || content.touched)" class="error">
        Conținutul este necesar.
      </div>
    </div>

    <!-- Tags -->
    <div class="form-group">
      <label for="tags">Cuvinte cheie (SEO):</label>
      <input type="text" id="tags" [(ngModel)]="tagsInput" name="tags">
      <button type="button" (click)="addTag()">Adaugă Tag</button>
      <div class="tags-list">
        <span *ngFor="let tag of article.tags; let i = index">
          {{ tag }} <button type="button" (click)="removeTag(i)">x</button>
        </span>
      </div>
    </div>

    <!-- Categorie -->
    <div class="form-group">
      <label for="category">Categorie:</label>
      <select id="category" [required]="!isEditMode"
              [(ngModel)]="article.categoryId" name="category" #category="ngModel">
        <option *ngFor="let category of categories" [value]="category.id">{{ category.name }}</option>
      </select>
      <div *ngIf="!isEditMode && category.invalid && (category.dirty || category.touched)" class="error">
        Categoria este necesară.
      </div>
    </div>

    <button type="submit" [disabled]="!isEditMode && articleForm.form.invalid">
      {{ isEditMode ? 'Update Articol' : 'Adaugă Articol' }}
    </button>
  </form>
</div>
